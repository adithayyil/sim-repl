[project]
name = "simplay"
version = "0.1.0"
description = "Mutation audits of sensor-driver checks under Simantic/Renode"
requires-python = ">=3.11"
dependencies = [
    # GitHub main, not PyPI: the published 0.3.1 differs in how it handles
    # `parts=` together with `repl=`, which this harness does not use.
    "simantic @ git+https://github.com/simantic-dev/pippy@c93d29f4a4fa9b95b15e677b2ac80652c3bbd5cc",
]

[project.scripts]
simplay = "simplay.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simplay"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The SPI peers run inside Renode's IronPython 2.7, where compact one-liners,
# %-formatting and no f-strings are the readable style.
"src/simplay/sensors/*/peer.py" = ["E501", "E701", "E702", "SIM102", "UP031"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs the ARM toolchain and the Simantic engine"]